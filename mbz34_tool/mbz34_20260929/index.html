<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBZ 34 Tool Test -- 29-09-2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #898E8C;
      overflow: hidden;
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
    }

    #app {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    #canvas-holder {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0 24px 24px;
      position: relative;
    }

    #canvas-holder canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      background: #000;
      box-shadow: 0 0 0 1px #222;
    }

    /* Margins / guide lines: drawn on their own canvas on top, so they never end up in an export */
    #canvas-holder canvas.guides-overlay {
      position: absolute;
      max-width: none;
      max-height: none;
      background: transparent;
      box-shadow: none;
      pointer-events: none;
    }

    #panel {
      flex: 0 0 420px;
      width: 420px;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px 18px 40px 18px;
      background: #0e0e0e;
      border-left: 1px solid #242424;
      color: #eee;
    }

    #panel h3 {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7a7a7a;
      margin: 22px 0 10px 0;
      padding-bottom: 6px;
      border-bottom: 1px solid #242424;
    }

    #panel h3:first-child {
      margin-top: 0;
    }

    #panel .field {
      margin-bottom: 10px;
    }

    #panel .field-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #999;
      margin-bottom: 4px;
      white-space: nowrap;
      gap: 8px;
    }

    #panel .field-label .val {
      color: #ddd;
    }

    #panel .field-row {
      display: flex;
      gap: 10px;
    }

    #panel .field-row .field {
      flex: 1;
      min-width: 0;
    }

    #panel input[type="range"] {
      width: 100%;
    }

    #panel select,
    #panel input[type="text"],
    #panel input[type="number"],
    #panel textarea {
      width: 100%;
      background: #1a1a1a;
      color: #eee;
      border: 1px solid #333;
      font-family: inherit;
      font-size: 12px;
      padding: 4px 6px;
    }

    #panel textarea {
      resize: vertical;
    }

    #panel button {
      background: #1e1e1e;
      color: #eee;
      border: 1px solid #3a3a3a;
      font-family: inherit;
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      margin: 0 6px 6px 0;
    }

    /* Playback / export buttons fill their space (half each when two share a row) */
    #panel button.full-btn {
      display: block;
      width: 100%;
      margin-right: 0;
    }

    #panel button:hover {
      background: #2a2a2a;
    }

    #panel button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #panel .status {
      font-size: 11px;
      color: #999;
      line-height: 1.5;
      word-break: break-word;
    }

    #panel .axis-note {
      font-size: 10px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    #panel input[type="checkbox"] {
      margin-right: 6px;
    }

    #panel label.checkbox-label {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 10px;
    }

    #panel label.axis-checkbox-label {
      display: flex;
      align-items: center;
      font-size: 10px;
      color: #999;
      white-space: nowrap;
      margin: 2px 0 10px 0;
    }

    #panel input[type="color"] {
      width: 100%;
      height: 26px;
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 2px;
    }

    #panel .swatch-row {
      display: flex;
      gap: 6px;
    }

    #panel .swatch {
      width: 28px;
      height: 28px;
      border: 2px solid #333;
      border-radius: 3px;
      cursor: pointer;
      box-sizing: border-box;
    }

    #panel .swatch:hover {
      border-color: #666;
    }

    #panel .swatch-selected {
      border-color: #fff;
      box-shadow: 0 0 0 1px #fff;
    }

    #tab-bar,
    #guide-tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 0 0 12px 0;
    }

    #tab-bar button,
    #guide-tab-bar button {
      margin: 0;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #999;
    }

    #tab-bar button.tab-active,
    #guide-tab-bar button.tab-active {
      background: #24344a;
      border-color: #5a9fff;
      color: #fff;
    }

    #tab-bar button.tab-add,
    #guide-tab-bar button.tab-add {
      border-style: dashed;
      color: #7a7a7a;
    }

    #box-settings,
    #guide-settings {
      border: 1px solid #202020;
      border-radius: 4px;
      padding: 12px 12px 4px 12px;
      margin-bottom: 20px;
      background: #0b0b0b;
    }

    .axis-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 2px;
    }

    .axis-row .field {
      flex: 1;
      min-width: 0;
      margin-bottom: 0;
    }
  </style>

  <script src="libraries/p5.js"></script>

  <script src="mbz34_20260929_sketch.js"></script>
</head>

<body>
  <div id="app">
    <div id="canvas-holder"></div>
    <div id="panel"></div>
  </div>
</body>

</html>
